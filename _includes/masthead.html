<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% if page.lang == "zh-CN" %}
            {% assign navigation = site.data.navigation.main_zh %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/zh/#about-me" target="_self">主页</a></li>
          {% else %}
            {% assign navigation = site.data.navigation.main %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/#about-me" target="_self">Homepage</a></li>
          {% endif %}
          {% for link in navigation %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="language-switch" role="group" aria-label="Language switcher">
        <a href="/" lang="en" hreflang="en" target="_self"{% unless page.lang == "zh-CN" %} class="is-active" aria-current="page"{% endunless %}>EN</a>
        <a href="/zh/" lang="zh-CN" hreflang="zh-CN" target="_self"{% if page.lang == "zh-CN" %} class="is-active" aria-current="page"{% endif %}>中文</a>
      </div>
    </div>
  </div>
</div>
